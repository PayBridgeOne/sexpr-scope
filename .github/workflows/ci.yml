name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  server:
    name: Language server (build & test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm install
      - run: npm run build
      - run: node --test "out/test/**/*.test.js"

  extension:
    name: Extension (build)
    runs-on: ubuntu-latest
    needs: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      # The extension depends on the built server (file:../server).
      - name: Build server
        working-directory: server
        run: |
          npm install
          npm run build
      - name: Build extension
        working-directory: extension
        run: |
          npm install
          npm run build
